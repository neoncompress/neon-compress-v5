<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON COMPRESS V5</title>

<style>
:root {
  --red: #ff334e;
  --bg: #080808;
  --card: #141414;
  --line: #292929;
  --text: #fff;
  --muted: #999;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 16px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

header {
  text-align: center;
  padding: 25px 0;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: var(--red);
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 10px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 16px;
}

h2 {
  font-size: 17px;
  margin-top: 0;
}

.upload {
  display: block;
  border: 2px dashed #444;
  border-radius: 12px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  color: var(--muted);
}

.upload input {
  display: none;
}

.file-info {
  margin-top: 15px;
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  background: var(--red);
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.secondary {
  background: #292929;
}

.status {
  margin-top: 15px;
  color: var(--red);
  font-size: 13px;
  text-align: center;
  overflow-wrap: anywhere;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #090909;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  color: #ccc;
  font-size: 12px;
  line-height: 1.7;
  max-height: 350px;
  overflow: auto;
}

footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  padding: 20px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">NEON <span>COMPRESS</span></div>
  <div class="subtitle">V5 INDEPENDENT VIDEO ENGINE</div>
</header>

<div class="card">
  <h2>SELECT VIDEO</h2>

  <label class="upload">
    <input type="file" id="videoInput" accept="video/mp4,.mp4">
    <div>＋</div>
    <div>Choose MP4 Video</div>
    <div class="file-info" id="fileInfo">No video selected</div>
  </label>

  <button id="inspectBtn" disabled>INSPECT VIDEO</button>
  <button id="processBtn" disabled>START V5 PROCESSING</button>

  <div class="status" id="status">V5 ENGINE READY</div>
</div>

<div class="card">
  <h2>VIDEO INFORMATION</h2>
  <pre id="info">Waiting for video...</pre>
</div>

<div class="card">
  <h2>PROCESSING RESULT</h2>
  <pre id="result">No processing yet.</pre>
  <button id="downloadBtn" class="secondary" hidden>
    DOWNLOAD VIDEO
  </button>
</div>

<footer>
  NEON COMPRESS V5 — INDEPENDENT TEST VERSION
</footer>

</div>

<script src="./processing.js"></script>

<script>
const input = document.getElementById("videoInput");
const fileInfo = document.getElementById("fileInfo");
const inspectBtn = document.getElementById("inspectBtn");
const processBtn = document.getElementById("processBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const infoBox = document.getElementById("info");
const resultBox = document.getElementById("result");

let selectedFile = null;
let outputUrl = null;

function formatSize(bytes) {
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

input.addEventListener("change", () => {
  selectedFile = input.files[0];

  if (!selectedFile) return;

  if (outputUrl) {
    URL.revokeObjectURL(outputUrl);
    outputUrl = null;
  }

  downloadBtn.hidden = true;
  infoBox.textContent = "Waiting for inspection...";
  resultBox.textContent = "No processing yet.";

  fileInfo.textContent =
    selectedFile.name + " (" + formatSize(selectedFile.size) + ")";

  inspectBtn.disabled = false;
  processBtn.disabled = false;

  statusBox.textContent = "VIDEO SELECTED";
});

inspectBtn.addEventListener("click", async () => {
  try {
    inspectBtn.disabled = true;
    statusBox.textContent = "INSPECTING...";

    const data = await window.NEON_V5.inspectVideoV5(selectedFile);

    infoBox.textContent = JSON.stringify(data, null, 2);
    statusBox.textContent = "INSPECTION COMPLETE";

  } catch (error) {
    statusBox.textContent = "INSPECTION FAILED";
    infoBox.textContent = error.message;
  }

  inspectBtn.disabled = false;
});

processBtn.addEventListener("click", async () => {
  try {
    processBtn.disabled = true;
    inspectBtn.disabled = true;
    downloadBtn.hidden = true;

    statusBox.textContent = "PROCESSING...";

    const output = await window.NEON_V5.optimizeVideoV5(selectedFile);

    if (outputUrl) URL.revokeObjectURL(outputUrl);

    outputUrl = URL.createObjectURL(output.file);

    resultBox.textContent = JSON.stringify({
      inputSize: formatSize(selectedFile.size),
      outputSize: formatSize(output.file.size),
      method: output.method,
      changes: output.changes
    }, null, 2);

    downloadBtn.hidden = false;
    statusBox.textContent = "PROCESSING COMPLETE";

  } catch (error) {
    statusBox.textContent = "PROCESSING FAILED";
    resultBox.textContent = error.message;
  }

  processBtn.disabled = false;
  inspectBtn.disabled = false;
});

downloadBtn.addEventListener("click", () => {
  if (!outputUrl) return;

  const a = document.createElement("a");
  a.href = outputUrl;
  a.download = "neoncompress-v5.mp4";
  a.click();
});
</script>

</body>
</html>
